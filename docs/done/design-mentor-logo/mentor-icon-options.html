<!doctype html><meta charset="utf-8"><title>Mentor icon options</title>
<style>
:root{--ink:#17151f;--muted:#6b7280}
body{margin:0;padding:36px;background:#f4f6ff;font:600 15px/1.35 "Segoe UI",system-ui,sans-serif;color:var(--ink)}
h1{font-size:22px;margin:0 0 4px}p.s{margin:0 0 24px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1100px}
.c{background:#fff;border-radius:22px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 30px -20px rgba(67,56,202,.5)}
.row{display:flex;gap:16px;align-items:center;justify-content:center;height:110px}
.tile{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#06c2fb,#5b21e0 55%,#dd42fb)}
.tile svg{width:30px;height:30px}.big svg{width:64px;height:64px}
.flow{width:64px;height:64px;flex:none;background:linear-gradient(100deg,#06c2fb,#5b21e0,#dd42fb,#06c2fb);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.n{font-size:17px;margin-top:6px}.d{color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.pick{display:inline-block;margin-top:8px;font-size:12px;background:#eef2ff;color:#4338ca;border-radius:99px;padding:2px 10px}
</style>
<h1>Mentor icon options</h1><p class="s">Each is shown as the top-bar button (white on gradient), large, and as the flowing "thinking" logo (colour moving inside the shape, nothing behind it).</p>
<div class="grid" id="g"></div>
<script>
const I=[
["A","Tutor bubble","A chat bubble with a mortarboard cut into it. Reads as 'AI tutor' at a glance. Recommended.",
 `<path fill-rule="evenodd" d="M7 3h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-6l-4 4v-4a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zM12 6.2 18.4 9 12 11.8 5.6 9zM8.4 11.2v2c0 .9 1.6 1.7 3.6 1.7s3.6-.8 3.6-1.7v-2L12 12.8zM18.4 9.6h.8v3h-.8z"/>`],
["B","Owl mentor","A wise owl: ear tufts, big eyes. Friendly and memorable; a mascot rather than a symbol.",
 `<path fill-rule="evenodd" d="M4 3l4 2.4h8L20 3v8.5c0 5-3.6 9.5-8 9.5s-8-4.5-8-9.5zM8.6 9.2a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8zm6.8 0a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8zM12 14.6l-1.5 2.2h3z"/>`],
["C","Compass + AI mark (CHOSEN)","The compass ring with its four direction ticks and the AI mark where the needle was, in the RENYXERA brand gradient (cyan, violet, magenta).",
 `<path d="M12 1a11 11 0 1 1 0 22a11 11 0 1 1 0-22zM12 2.8a9.2 9.2 0 1 0 0 18.4a9.2 9.2 0 1 0 0-18.4zM11.2 2.8h1.6v2.4h-1.6z M21.2 11.2v1.6h-2.4v-1.6z M12.8 21.2h-1.6v-2.4h1.6z M2.8 12.8v-1.6h2.4v1.6zM12 6.6C12.4 9.9 14.1 11.6 17.4 12C14.1 12.4 12.4 14.1 12 17.4C11.6 14.1 9.9 12.4 6.6 12C9.9 11.6 11.6 9.9 12 6.6z"/>`],
["D","Constellation","Linked stars: a knowledge graph and a night sky. Lines and dots, very 'AI network'.",
 `<g fill="currentColor"><circle cx="5" cy="17" r="2.2"/><circle cx="10" cy="8" r="2.2"/><circle cx="17" cy="14" r="2.2"/><circle cx="19" cy="5" r="2"/></g><path d="M5 17 10 8l7 6 2-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>`],
["E","Idea bulb","A bulb with a filament that is also a tiny circuit: understanding switching on.",
 `<path fill-rule="evenodd" d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2zM9.6 8.2h1.2l1.2 3 1.2-3h1.2l-1.8 5h-.8zM9 19h6v1.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5z"/>`],
["F","Open book + nodes","A book that opens into three connected points: notes that think.",
 `<path d="M2 6c3.2-1.2 6.4-1 10 1.4 3.6-2.4 6.8-2.6 10-1.4v13c-3.2-1.2-6.4-1-10 1.4-3.6-2.4-6.8-2.6-10-1.4z" fill="currentColor"/><g fill="#fff"><circle cx="12" cy="9.2" r="1.5"/><circle cx="8.2" cy="13.6" r="1.3"/><circle cx="15.8" cy="13.6" r="1.3"/></g><path d="M12 9.2 8.2 13.6M12 9.2l3.8 4.4" stroke="#fff" stroke-width="1" fill="none"/>`],
["G","Lighthouse","A beacon that guides: steady light, simple shape, strong silhouette.",
 `<path fill-rule="evenodd" d="M9.6 3h4.8l1 4h-6.8zM8.4 8.6h7.2l1.6 12.4H6.8zM9.6 11.2l.4 1.6h4l.4-1.6zM1.5 5.2l5.2 1.1-.4 1.5zM22.5 5.2l-5.2 1.1.4 1.5z"/>`],
["H","Mentor monogram","An 'M' made of a rising path with a dot on top: progress and mentoring.",
 `<path d="M4 20V8l8 8 8-8v12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="4.6" r="2.2" fill="currentColor"/>`],
];
const g=document.getElementById("g");
for(const [k,n,d,p] of I){
  const svg=`<svg viewBox="0 0 24 24" fill="currentColor">${p}</svg>`;
  const uri=`url('data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#000" color="#000">'+p.replaceAll('currentColor','#000').replaceAll('#fff','#000')+'</svg>')}')`;
  g.insertAdjacentHTML("beforeend",`<div class="c"><div class="row"><div class="tile">${svg}</div><div class="tile big" style="background:none;color:#4338ca;width:64px;height:64px">${svg}</div><div class="flow" style="--m:${uri}"></div></div><div class="n">${k} · ${n}</div><div class="d">${d}</div>${k==="C"?'<span class="pick">chosen by the owner</span>':''}</div>`);
}
</script>
