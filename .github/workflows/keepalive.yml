name: Keep-alive

# The free Supabase plan pauses a project after 7 days without traffic. Pinging the
# app's health route (which reads the database) every 3 days keeps it awake. Free.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health (database read)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w "%{http_code}" https://gate.renyxera.workers.dev/api/health) && cat body.json && echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Health check failed ($code)"; exit 1
