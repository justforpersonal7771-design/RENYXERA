name: CI

on:
  pull_request:
  # Manual redeploy from the Actions tab (e.g. after rotating a secret).
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Speed (23 Nov 2026): the pipeline took 15-20 minutes because everything ran one after another. Now lint and the quick checks run beside the
  # build, the Next build cache and the Playwright browser are cached between runs, and the deploy waits for `check` and `quick` only.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # informational, matches next.config.ts's eslint.ignoreDuringBuilds: true; never blocks a deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

  quick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Goals engine acceptance test
        run: npm run check:goals

      - name: Grading edge cases
        run: npm run check:grading

      - name: Calibration data checks
        run: npm run check:calibration

      - name: Mock question order (same paper, GA first, score order-independent)
        run: npm run check:mock-order

      - name: Adaptive subject radar rules (1 to 20 subjects)
        run: npm run check:radar

      - name: Every question image resolves (incl. shared-pool questions)
        run: npm run check:images

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          # Public values only (the browser gets them anyway) — lets the smoke test load data.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Bundle size budget
        run: node scripts/check-bundle.mjs

      - name: Security checks (no service-role key in bundle; anon can't read answer keys)
        run: npm run check:security
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Playwright browser cache
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: End-to-end smoke (phone + desktop × light + dark, guest exam flow)
        run: |
          # Ubuntu mirrors occasionally time out while fetching browser fonts; retry instead of failing the deploy.
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "browser install failed (attempt $i), retrying in 20s"; sleep 20; sudo apt-get update -o Acquire::Retries=3 || true; [ "$i" = 3 ] && exit 1; done
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/about && break; sleep 2; done
          BASE=http://localhost:3000 node scripts/e2e-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  # Auto-deploy: every push to main that passes ALL checks above goes live on Cloudflare.
  # Pull requests and failing builds never deploy. Needs repo secrets CLOUDFLARE_API_TOKEN
  # and CLOUDFLARE_ACCOUNT_ID, plus the public NEXT_PUBLIC_* values (baked in at build).
  # Server-only secrets (service role, Gemini) already live on the Worker itself.
  deploy:
    needs: [check, quick]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-deploy-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-deploy-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN }}
          NEXT_PUBLIC_BILLING_MODE: live  # Razorpay LIVE mode (real payments). Needs the live key id in wrangler.jsonc and the live secrets in Cloudflare.
          NEXT_PUBLIC_AMAZON_TAG: renyxera-21  # public Amazon Associates store ID (appears in every link)

      - name: Smoke-test the live site
        run: |
          for path in / /about /gate-cse /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://gate.renyxera.workers.dev$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
