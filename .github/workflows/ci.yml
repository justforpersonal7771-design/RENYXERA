name: CI

on:
  pull_request:
  # Manual redeploy from the Actions tab (e.g. after rotating a secret).
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true # matches next.config.ts's eslint.ignoreDuringBuilds: true — lint is informational here, not a gate

      - name: Build
        run: npm run build
        env:
          # Public values only (the browser gets them anyway) — lets the smoke test load data.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Security checks (no service-role key in bundle; anon can't read answer keys)
        run: npm run check:security
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Goals engine acceptance test
        run: npm run check:goals

      - name: Grading edge cases
        run: npm run check:grading

      - name: Calibration data checks
        run: npm run check:calibration

      - name: Mock question order (same paper, GA first, score order-independent)
        run: npm run check:mock-order

      - name: End-to-end smoke (phone + desktop × light + dark, guest exam flow)
        run: |
          npx playwright install --with-deps chromium
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/about && break; sleep 2; done
          BASE=http://localhost:3000 node scripts/e2e-smoke.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  # Auto-deploy: every push to main that passes ALL checks above goes live on Cloudflare.
  # Pull requests and failing builds never deploy. Needs repo secrets CLOUDFLARE_API_TOKEN
  # and CLOUDFLARE_ACCOUNT_ID, plus the public NEXT_PUBLIC_* values (baked in at build).
  # Server-only secrets (service role, Gemini) already live on the Worker itself.
  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN }}

      - name: Smoke-test the live site
        run: |
          for path in / /about /gate-cse /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://gate.renyxera.workers.dev$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
